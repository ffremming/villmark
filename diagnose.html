<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VILLMARK — diagnose</title>
<style>
  body{ margin:0; padding:16px; background:#0b120d; color:#e9e2c8;
        font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  h1{ font-size:15px; letter-spacing:.08em; color:#f5c342; margin:0 0 4px; }
  p.sub{ color:#9fa891; margin:0 0 16px; font-size:12px; }
  .steg{ border-left:3px solid #2f5836; padding:8px 0 8px 10px; margin-bottom:8px;
         word-break:break-word; }
  .ok{ border-color:#3f8a4b; }
  .feil{ border-color:#c9453a; }
  .gaar{ border-color:#f5c342; }
  .navn{ color:#9fa891; font-size:12px; }
  .verdi{ white-space:pre-wrap; }
  .feil .verdi{ color:#ff9c92; }
  button{ font:inherit; background:#25412b; color:#e9e2c8; border:2px solid #4e8a55;
          padding:12px 18px; margin:14px 0; width:100%; }
  textarea{ width:100%; height:130px; background:#101a13; color:#9fa891;
            border:2px solid #2f5836; padding:8px; font:12px/1.5 ui-monospace,monospace; }
</style>
</head>
<body>

<h1>VILLMARK — DIAGNOSE</h1>
<p class="sub">Kjorer hvert ledd i skannekjeden og viser hvor det ryker.</p>

<div id="ut"></div>
<button id="kopier">KOPIER HELE RAPPORTEN</button>
<textarea id="rapport" readonly></textarea>

<script src="species.js"></script>
<script src="artsmapping.js"></script>
<script src="klassifiser.js"></script>
<script src="modellkonfig.js"></script>
<script>
const UT = document.getElementById('ut');
const linjer = [];

function steg(navn){
  const d = document.createElement('div');
  d.className = 'steg gaar';
  d.innerHTML = '<div class="navn">' + navn + '</div><div class="verdi">kjorer …</div>';
  UT.appendChild(d);
  return {
    ok(v){ d.className = 'steg ok'; d.lastChild.textContent = String(v); linjer.push('OK   ' + navn + ': ' + v); },
    feil(e){
      const m = e && e.stack ? e.stack : String(e);
      d.className = 'steg feil'; d.lastChild.textContent = m;
      linjer.push('FEIL ' + navn + ': ' + m);
    },
    /* fremdrift oppdaterer bare skjermen. Den skal ikke i rapporten -
       ellers drukner den i hundre "laster 36 %"-linjer. */
    fremdrift(v){ d.lastChild.textContent = String(v); },
  };
}

/* Lager et testbilde uten aa trenge kamera: et gront felt med en morkere
   flekk. Poenget er ikke aa treffe en art, men aa fa hele kjeden til aa kjore. */
function testbilde(){
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#4a7a3a'; g.fillRect(0, 0, 512, 512);
  g.fillStyle = '#6b4a2a'; g.beginPath(); g.arc(256, 256, 120, 0, 7); g.fill();
  return c;
}

(async () => {
  steg('nettleser').ok(navigator.userAgent);
  steg('secure context').ok(window.isSecureContext + '  (Cache API krever true)');
  steg('crossOriginIsolated').ok(String(window.crossOriginIsolated) +
    '  (false er forventet paa GitHub Pages)');
  steg('deviceMemory').ok((navigator.deviceMemory || 'ukjent') + ' GB');
  steg('WebGPU').ok(navigator.gpu ? 'finnes' : 'mangler — bruker wasm');
  steg('Cache API').ok(typeof caches !== 'undefined' ? 'finnes' : 'MANGLER');

  const s0 = steg('KLASSIFISER lastet');
  if (!window.KLASSIFISER) { s0.feil(new Error('klassifiser.js kjorte ikke')); return; }
  s0.ok('ja, base = ' + KLASSIFISER.base);

  const s1 = steg('ARTSMAPPING lastet');
  if (!window.ARTSMAPPING) { s1.feil(new Error('artsmapping.js kjorte ikke')); return; }
  s1.ok('ja, ' + (typeof SPECIES !== 'undefined' ? SPECIES.length : '?') + ' arter');

  const s2 = steg('status');
  try { s2.ok(JSON.stringify(await KLASSIFISER.status())); } catch (e) { s2.feil(e); }

  for (const navn of ['inat21', 'speciesnet']) {
    const s = steg('HEAD ' + navn + '.onnx');
    try {
      const r = await fetch(KLASSIFISER.base + navn + '.onnx', { method: 'HEAD' });
      s.ok(r.status + '  ' + Math.round(Number(r.headers.get('content-length')) / 1e6) + ' MB');
    } catch (e) { s.feil(e); }

    const sm = steg('GET ' + navn + '.meta.json');
    try {
      const r = await fetch(KLASSIFISER.base + navn + '.meta.json');
      s2.ok; sm.ok(r.status + '  ' + JSON.stringify(await r.json()));
    } catch (e) { sm.feil(e); }
  }

  const s4 = steg('HELE KJEDEN paa et syntetisk bilde');
  try {
    const t = performance.now();
    const svar = await KLASSIFISER.klassifiser(testbilde(), {
      bekreftNedlasting: async () => true,
      funnet: new Set(),
      onFase: (fase, andel) => s4.fremdrift(fase + ' ' + Math.round(andel * 100) + ' %'),
    });
    s4.ok(Math.round(performance.now() - t) + ' ms\n' + JSON.stringify(svar, null, 1));
  } catch (e) {
    s4.feil(e);
  }

  const s5 = steg('ort etter kjoring');
  s5.ok(window.ort ? ('versjon ' + (ort.env.versions ? ort.env.versions.common : '?') +
    ', numThreads ' + ort.env.wasm.numThreads + ', proxy ' + ort.env.wasm.proxy)
    : 'ort ble aldri lastet');

  document.getElementById('rapport').value = linjer.join('\n');
})();

document.getElementById('kopier').onclick = async () => {
  const t = document.getElementById('rapport');
  t.select();
  try { await navigator.clipboard.writeText(t.value); alert('kopiert'); }
  catch (_) { document.execCommand('copy'); }
};
</script>
</body>
</html>
